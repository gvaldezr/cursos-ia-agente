<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/slides.css?v=cb2">
<style>
  html,body{margin:0;background:#000;}
  .ana-slide-viewer{position:static;display:flex;height:720px;width:1280px;}
  .ana-slide-stage{position:relative;}
  .ana-slide-viewer .slide{animation:none !important;}
</style></head>
<body>
<div class="ana-slide-viewer active" id="slide-viewer">
  <header class="ana-slide-toolbar"><span class="ana-slide-toolbar__title">Nivel</span>
    <div class="ana-slide-toolbar__actions"><span class="ana-slide-toolbar__counter">1 / 14</span>
      <button class="ana-slide-toolbar__btn">⛶</button><button class="ana-slide-toolbar__btn"><span>✕</span></button></div></header>
  <div class="ana-slide-stage" id="slide-stage"></div>
  <img class="ana-slide-logo" src="assets/logo-ia/ia-solid-negativo.png" alt="iA">
  <footer class="ana-slide-nav"><button class="ana-slide-nav__btn">←</button>
    <div class="ana-slide-progress"><div class="ana-slide-progress__fill" style="width:7%"></div></div>
    <div class="ana-slide-nav__dots" id="slide-dots"></div><button class="ana-slide-nav__btn">→</button></footer>
</div>
<script>
  var p=new URLSearchParams(location.search); var level=p.get('n')||'1'; var idx=parseInt(p.get('s')||'1',10);
  var dots=document.getElementById('slide-dots'); for(var i=0;i<8;i++){var d=document.createElement('button');d.className='ana-slide-nav__dot';dots.appendChild(d);}
  fetch('slides/nivel-'+level+'.html?v=cb2').then(r=>r.text()).then(html=>{
    var doc=new DOMParser().parseFromString(html,'text/html'); var slides=doc.querySelectorAll('.slide'); var stage=document.getElementById('slide-stage');
    slides.forEach(function(s,i){s.classList.remove('active'); if(i===idx-1){s.classList.add('active');} stage.appendChild(s);});
    window.__ready=true;
  });
</script></body></html>
