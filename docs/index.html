<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Práctica para Líderes Anáhuac | Universidad Anáhuac Mayab</title>
  <meta name="description" content="Programa de formación en inteligencia artificial generativa para directivos de la Universidad Anáhuac Mayab. 8 niveles progresivos, de conceptos fundamentales a agentes de IA.">
  <meta name="author" content="Universidad Anáhuac Mayab">
  <meta property="og:title" content="IA Práctica para Líderes Anáhuac">
  <meta property="og:description" content="Programa de formación en inteligencia artificial generativa para directivos universitarios.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#FF5900">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Roboto:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Skip Link -->
  <a href="#main-content" class="ana-skip-link">Ir al contenido principal</a>

  <!-- ═══════════════════════════════════════
       HEADER
       ═══════════════════════════════════════ -->
  <header class="ana-header" role="banner">
    <div class="ana-header__inner">
      <!-- Logo -->
      <a href="#home" class="ana-header__logo" aria-label="Inicio">
        <img src="assets/logo-anahuac.svg" alt="Anáhuac Mayab" width="140" height="32">
      </a>
      <span class="ana-header__title">IA Práctica para Líderes</span>

      <!-- Header progress -->
      <div class="ana-header__progress" aria-label="Progreso del programa">
        <div class="ana-header__progress-bar">
          <div class="ana-header__progress-fill" id="header-progress-fill" style="width: 0%"></div>
        </div>
        <span class="ana-header__progress-text" id="header-progress-text">0%</span>
      </div>

      <!-- Version picker -->
      <div class="ana-version-picker" role="group" aria-label="Versión del curso">
        <button class="ana-version-picker__btn active" data-version="academica" aria-pressed="true">
          Académica
        </button>
        <button class="ana-version-picker__btn" data-version="administrativa" aria-pressed="false">
          Administrativa
        </button>
      </div>

      <!-- Desktop nav -->
      <nav class="ana-header__nav" aria-label="Navegación principal">
        <a href="#home">Inicio</a>
        <a href="#progreso">Progreso</a>
        <a href="#recursos">Recursos</a>
      </nav>

      <!-- Hamburger (mobile) -->
      <button class="ana-hamburger" id="hamburger-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobile-menu">
        <svg aria-hidden="true"><use href="#icon-menu"></use></svg>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════
       MOBILE MENU
       ═══════════════════════════════════════ -->
  <div class="ana-mobile-menu" id="mobile-menu" role="dialog" aria-label="Menú de navegación" aria-modal="true">
    <div class="ana-mobile-menu__backdrop" id="mobile-menu-backdrop"></div>
    <div class="ana-mobile-menu__panel">
      <button class="ana-mobile-menu__close" id="mobile-menu-close" aria-label="Cerrar menú">
        <svg width="24" height="24" aria-hidden="true"><use href="#icon-x"></use></svg>
      </button>
      <nav class="ana-mobile-menu__nav" aria-label="Navegación móvil" id="mobile-nav">
        <a href="#home">Inicio</a>
        <a href="#progreso">Mi progreso</a>
        <a href="#recursos">Recursos</a>
        <hr style="border: none; border-top: 1px solid var(--ana-border-divider); margin: 8px 0;">
        <!-- Level links injected by JS -->
      </nav>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════════ -->
  <main id="main-content">
    <div id="app">
      <!-- Content rendered by JS router -->
    </div>
  </main>

  <!-- ═══════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════ -->
  <footer class="ana-footer" role="contentinfo">
    <div class="ana-footer__inner">
      <p class="ana-footer__text">
        IA Práctica para Líderes Anáhuac · Universidad Anáhuac Mayab · Septiembre 2026
      </p>
    </div>
  </footer>

  <!-- Toast notification -->
  <div class="ana-toast" id="toast" role="status" aria-live="polite">
    <p class="ana-toast__text" id="toast-text"></p>
  </div>

  <!-- ═══════════════════════════════════════
       SVG ICON SPRITES
       ═══════════════════════════════════════ -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </symbol>
    <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 18 6-6-6-6"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
    </symbol>
    <symbol id="icon-circle-dot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/>
    </symbol>
    <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
    </symbol>
    <symbol id="icon-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
    </symbol>
    <symbol id="icon-telescope" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m10.065 12.493-6.18 1.318a.934.934 0 0 1-1.108-.702l-.537-2.15a1.07 1.07 0 0 1 .691-1.265l13.504-4.44"/><path d="m13.56 11.747 4.332-.924"/><path d="m16 21-3.105-6.21"/><path d="M16.485 5.94a2 2 0 0 1 1.455-2.425l1.09-.272a1 1 0 0 1 1.212.727l1.515 6.06a1 1 0 0 1-.727 1.213l-1.09.272a2 2 0 0 1-2.425-1.455z"/><path d="m6.158 8.633 1.114 4.456"/>
    </symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-graduation-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 10 3 12 0v-5"/>
    </symbol>
    <symbol id="icon-briefcase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>

  </svg>

  <!-- App Script -->
  <script src="js/app.js" defer></script>
</body>
</html>
