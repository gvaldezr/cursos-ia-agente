<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Roboto:wght@300;400;500&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #deck {
    width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #FF5900 0%, #432F64 100%);
    font-family: 'Roboto', system-ui, sans-serif;
    color: #fff;
  }

  /* ── BASE: every slide fills viewport, centered ── */
  .slide {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    display: none;
    flex-direction: column;
    justify-content: center !important;
    align-items: center !important;
    text-align: center;
    padding: 1.2rem 1.5rem;
    background: linear-gradient(135deg, #FF5900 0%, #432F64 100%) !important;
    color: #fff !important;
  }
  .slide:first-child { display: flex !important; }

  /* ── ALL inner wrappers: fill parent, flex center ── */
  .slide__gradient,
  .slide__content,
  .slide > div {
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 1rem !important;
    border-radius: 0 !important;
    display: flex !important;
    flex-direction: column;
    justify-content: center !important;
    align-items: center !important;
    background: transparent !important;
    position: relative;
  }

  /* Empty gradient divs (niveles 7-8) should not interfere */
  .slide__gradient:empty,
  .slide > div:empty {
    position: absolute !important;
    padding: 0 !important;
  }

  /* ── Typography: all white on gradient ── */
  h1, .ana-display, .slide__title, .slide-title {
    font-family: 'Manrope', sans-serif !important;
    font-size: clamp(1rem, 4vw, 1.5rem) !important;
    font-weight: 800 !important;
    color: #fff !important;
    -webkit-text-fill-color: #fff !important;
    background: none !important;
    line-height: 1.2;
    margin-bottom: 0.4rem;
  }

  p, span, em {
    color: rgba(255,255,255,0.8) !important;
    -webkit-text-fill-color: rgba(255,255,255,0.8) !important;
    font-size: clamp(0.55rem, 1.8vw, 0.8rem);
    line-height: 1.4;
  }

  .ana-overline, .slide__overline, .slide__phase, .slide__badge {
    font-size: 0.5rem !important;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.55) !important;
    -webkit-text-fill-color: rgba(255,255,255,0.55) !important;
    margin-bottom: 0.25rem;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
  }

  .slide__meta, .slide__meta div {
    display: flex !important;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 0.3rem;
  }
  .slide__meta span, .slide__meta-item {
    font-size: 0.5rem !important;
    color: rgba(255,255,255,0.45) !important;
    -webkit-text-fill-color: rgba(255,255,255,0.45) !important;
  }

  .slide__epigraph, .slide__narrative { 
    max-width: 85%;
    font-style: italic;
  }

  /* Hide non-essential elements */
  .slide__callout, .reflection, .slide__note,
  .slide__prompt, .slide__two-col, .grid-2, .grid-3,
  table, .slide__table, .content-box { display: none !important; }
</style>
</head>
<body>
<div id="deck"></div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var nivel = params.get('n') || '1';
  fetch('nivel-' + nivel + '.html')
    .then(function(r) { return r.ok ? r.text() : ''; })
    .then(function(html) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var first = doc.querySelector('.slide');
      if (first) {
        document.getElementById('deck').appendChild(document.importNode(first, true));
      }
    })
    .catch(function() {
      document.getElementById('deck').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.5)">No disponible</div>';
    });
})();
</script>
</body>
</html>
