<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Roboto:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #deck {
    background: #0a0a1a;
    overflow: hidden;
    height: 100%;
    width: 100%;
    font-family: 'Roboto', system-ui, sans-serif;
    color: #e8e8f0;
  }

  /* ── Slide: fill entire viewport ── */
  .slide {
    width: 100% !important;
    height: 100% !important;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1.5rem 2rem;
    text-align: center;
    position: absolute;
    inset: 0;
    max-width: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    margin: 0 !important;
    background: #0a0a1a;
  }
  .slide:first-child { display: flex; }

  /* ── Cover: gradient fills everything ── */
  .slide--cover {
    background: linear-gradient(135deg, #FF5900 0%, #432F64 100%) !important;
    padding: 0 !important;
  }

  /* The .slide__gradient wrapper must also fill 100% */
  .slide--cover .slide__gradient {
    width: 100% !important;
    height: 100% !important;
    display: flex !important;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1.5rem 2rem;
    background: linear-gradient(135deg, #FF5900 0%, #432F64 100%) !important;
    border-radius: 0 !important;
    margin: 0 !important;
    max-width: none !important;
    box-sizing: border-box;
  }

  /* ── Typography ── */
  .slide--cover h1,
  .slide--cover .ana-display,
  .slide--cover .slide__title {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: 800;
    color: #fff !important;
    -webkit-text-fill-color: #fff !important;
    background: none !important;
    margin-bottom: 0.5rem;
    line-height: 1.2;
  }

  .slide--cover p {
    color: rgba(255,255,255,0.8);
    font-size: clamp(0.65rem, 2vw, 0.85rem);
    line-height: 1.5;
    max-width: 90%;
  }

  .slide--cover .ana-overline,
  .slide__overline {
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.6);
    margin-bottom: 0.3rem;
  }

  .slide--cover .slide__meta,
  .slide--cover div:last-child {
    font-size: 0.55rem;
    color: rgba(255,255,255,0.5);
    margin-top: 0.4rem;
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .slide--cover div:last-child span {
    font-size: 0.55rem;
  }

  /* ── Non-cover slides ── */
  .slide:not(.slide--cover) h2,
  .slide:not(.slide--cover) .ana-h2 {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(0.9rem, 3vw, 1.3rem);
    font-weight: 800;
    background: linear-gradient(135deg, #FF5900, #432F64);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.6rem;
  }

  /* Hide detail elements in compact preview */
  .slide__callout, .reflection, .slide__note { display: none; }
  .slide__prompt { display: none; }
  .slide__two-col { display: none; }
  .slide__body { font-size: 0.7rem; color: #c8c8d8; }
  table { font-size: 0.6rem; color: #c8c8d8; }
</style>
</head>
<body>
<div id="deck"></div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var nivel = params.get('n') || '1';
  fetch('nivel-' + nivel + '.html')
    .then(function(r) { return r.ok ? r.text() : ''; })
    .then(function(html) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var first = doc.querySelector('.slide');
      if (first) {
        document.getElementById('deck').appendChild(document.importNode(first, true));
      }
    })
    .catch(function() {
      document.getElementById('deck').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666">Vista previa no disponible</div>';
    });
})();
</script>
</body>
</html>
